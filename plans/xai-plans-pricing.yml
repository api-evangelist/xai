specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: xAI
providerId: xai
created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-08'
reconciled: false
tags:
- AI
- LLM
- Foundation Models
- Grok
- Generative AI
- Plans
description: >-
  Pricing for the xAI API is usage-based per token (input/output, with cached-input
  discounts) per model, plus per-call fees for built-in tools and discounts for
  the Batch API. Exact per-model rates have not been reconciled in this artifact;
  see the xAI Console Models page for current rates.
notes: >-
  Token-based costs are charged at model-specific rates; tool-invocation fees
  range from approximately $2.50 to $10 per 1,000 calls depending on the tool;
  the Batch API offers 20%-50% discounts off standard rates and does not count
  against rate limits. Per-million-token pricing per model is not yet reconciled.
sources:
- https://x.ai/
- https://docs.x.ai/docs/models
- https://console.x.ai/team/default/models
plans:
- id: xai-pay-as-you-go
  name: Pay-as-you-go (API)
  type: usage
  description: >-
    Standard API access billed per token consumed, per model, with prepaid or
    invoice-based credits. Billing covers input tokens, output tokens, and
    (where applicable) cached-input tokens, plus per-call tool-invocation fees.
  entries:
  - label: Token Usage
    name: token_usage
    type: usage
    metric: tokens
    limit: -1
    timeFrame: month
    geo: global
    unit: 1000000
    price: see https://docs.x.ai/docs/models
    userMultiplied: false
  - label: Tool Invocations
    name: tool_invocations
    type: usage
    metric: calls
    limit: -1
    timeFrame: month
    geo: global
    unit: 1000
    price: '2.50-10.00'
    userMultiplied: false
  elements:
  - name: Chat Completions
  - name: Responses
  - name: Embeddings
  - name: Images
  - name: Video
  - name: Voice
  - name: Live Search
- id: xai-batch
  name: Batch API
  type: usage
  description: >-
    Discounted asynchronous processing for non-real-time workloads. Batch
    requests are 20-50% cheaper than the equivalent synchronous calls and do
    not count toward rate limits.
  entries:
  - label: Batch Token Usage
    name: batch_token_usage
    type: usage
    metric: tokens
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1000000
    price: 20-50% discount vs. synchronous rates
    userMultiplied: false
  elements:
  - name: Batch Chat Completions
  - name: Batch Embeddings
- id: xai-enterprise
  name: Enterprise / Custom
  type: enterprise
  description: >-
    Volume commitments, custom capacity, dedicated support, and negotiated
    pricing for enterprise customers. Contact xAI sales.
  entries:
  - label: Enterprise Agreement
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Custom Volume Pricing
  - name: Dedicated Capacity
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
