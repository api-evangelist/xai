openapi: 3.2.0
info:
  title: xAI's REST Video Generation Models API
  description: REST API for xAI compatible with other providers.
  license:
    name: ''
  version: 1.0.0
tags:
- name: Video Generation Models
paths:
  /v1/video-generation-models:
    get:
      tags:
      - Video Generation Models
      summary: List all video generation models available to the authenticating API key with…
      operationId: handle_video_generation_models_list_request
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVideoGenerationModelsResponse'
              example:
                models:
                - id: grok-imagine-video
                  fingerprint: fp_898ae9f31c
                  created: 1743724800
                  object: model
                  owned_by: xai
                  version: 1.0.0
                  input_modalities:
                  - text
                  - image
                  output_modalities:
                  - video
                  aliases: []
        '400':
          description: Bad request. The request is invalid or an invalid API key is provided.
      security:
      - bearerAuth: []
  /v1/video-generation-models/{model_id}:
    get:
      tags:
      - Video Generation Models
      summary: Get full information about a video generation model with its model_id
      operationId: handle_video_generation_model_get_request
      parameters:
      - name: model_id
        in: path
        description: ID of the model to get.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationModel'
              example:
                id: grok-imagine-video
                fingerprint: fp_898ae9f31c
                created: 1743724800
                object: model
                owned_by: xai
                version: '1.0'
                input_modalities:
                - text
                - image
                output_modalities:
                - video
                aliases: []
        '400':
          description: Bad request. The request is invalid or an invalid API key is provided.
        '404':
          description: Model not found
      security:
      - bearerAuth: []
components:
  schemas:
    VideoGenerationModel:
      type: object
      description: Details of a video generation model
      required:
      - id
      - fingerprint
      - created
      - object
      - owned_by
      - version
      - input_modalities
      - output_modalities
      - aliases
      properties:
        aliases:
          type: array
          items:
            type: string
          description: Alias ID(s) of the model that user can use in a request's model field.
        created:
          type: integer
          format: int64
          description: Model creation time in Unix timestamp.
        fingerprint:
          type: string
          description: Fingerprint of the xAI system configuration hosting the model.
        id:
          type: string
          description: Model ID.
        input_modalities:
          type: array
          items:
            type: string
          description: The input modalities supported by the model (e.g. "text", "image").
        object:
          type: string
          description: The object type, which is always `"model"`.
        output_modalities:
          type: array
          items:
            type: string
          description: The output modalities supported by the model (e.g. "video").
        owned_by:
          type: string
          description: Owner of the model.
        version:
          type: string
          description: Version of the model.
    ListVideoGenerationModelsResponse:
      type: object
      required:
      - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/VideoGenerationModel'
          description: Array of available video generation models.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
