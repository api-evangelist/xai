          - 'null'
          description: Whether to store the input message(s) and model response for later retrieval.
          default: true
        stream:
          type:
          - boolean
          - 'null'
          description: 'If set, partial message deltas will be sent. Tokens will be sent as data-only server-sent events as they become available, with the stream terminated by a `data: [DONE]` message.'
          default: false
          example: true
        temperature:
          type:
          - number
          - 'null'
          format: float
          description: What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
          default: 1
          example: 0.2
          maximum: 2
          minimum: 0
        text:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ModelResponseConfiguration'
            description: Settings for customizing a text response from the model.
        tool_choice:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ModelToolChoice'
            description: 'Controls which (if any) tool is called by the model. `none` means the model will not call any tool and instead generates a message. auto means the model can pick between generating a message or calling one or more tools. required means the model must call one or more tools. Specifying a particular tool via `{"type": "function", "function": {"name": "my_function"}}` forces the model to call that tool. `none` is the default when no tools are present. `auto` is the default if tools are present.'
        tools:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ModelTool'
          description: A list of tools the model may call in JSON-schema. Currently, only functions and web search are supported as tools. A max of 128 tools are supported.`web_search_preview` tool, if specified, will be overridden by `search_parameters`.
          maxItems: 128
        top_logprobs:
          type:
          - integer
          - 'null'
          format: int32
          description: An integer between 0 and 8 specifying the number of most likely tokens to return at each token position, each with an associated log probability. logprobs must be set to true if this parameter is used.
          maximum: 8
          minimum: 0
        top_p:
          type:
          - number
          - 'null'
          format: float
          description: An alternative to sampling with `temperature`, called nucleus sampling, where the model considers the results of the tokens with `top_p` probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. It is generally recommended to alter this or `temperature` but not both.
          default: 1
          maximum: 1
          exclusiveMinimum: 0
        truncation:
          type:
          - string
          - 'null'
          description: Not supported. Only maintained for compatibility reasons.
        user:
          type:
          - string
          - 'null'
          description: A unique identifier representing your end-user, which can help xAI to monitor and detect abuse.
    CompactionOutputItem:
      type: object
      description: 'A compaction item from a previous `/v1/responses/compact` call.


        Accepted as input in `/v1/responses` calls. Clients must treat

        `encrypted_content` as opaque — do not parse or depend on its

        internal structure.'
      required:
      - type
      - encrypted_content
      properties:
        encrypted_content:
          type: string
          description: The encrypted content of the compacted conversation.
        id:
          type:
          - string
          - 'null'
          description: The unique ID of the compaction item (e.g. `cmp_<uuid>`).
        type:
          type: string
          description: The type of the item. Always `"compaction"`.
    ModelUsage:
      type: object
      required:
      - input_tokens
      - input_tokens_details
      - output_tokens
      - output_tokens_details
      - total_tokens
      - num_sources_used
      - num_server_side_tools_used
      properties:
        cost_in_nano_usd:
          type:
          - integer
          - 'null'
          format: int64
          description: Cost in nano US dollars for this request.
        cost_in_usd_ticks:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Accurate cost of this request in USD ticks, where "tick" is defined as follows:

            TICKS_IN_USD_CENT: i64 = 100_000_000

            which means there is 10''000''000''000 ticks in one *dollar*.'
        input_tokens:
          type: integer
          format: int32
          description: Number of input tokens used.
        input_tokens_details:
          $ref: '#/components/schemas/InputTokensDetails'
          description: Breakdown of the input tokens.
        num_server_side_tools_used:
          type: integer
          format: int32
          description: Number of server side tools used.
        num_sources_used:
          type: integer
          format: int32
          description: Number of sources used (for live search).
        output_tokens:
          type: integer
          format: int32
          description: Number of output tokens used.
        output_tokens_details:
          $ref: '#/components/schemas/OutputTokensDetails'
          description: Breakdown of the output tokens.
        server_side_tool_usage_details:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ServerSideToolUsageDetails'
            description: Details about the server side tool usage.
        total_tokens:
          type: integer
          format: int32
          description: Total tokens used.
    McpCall:
      type: object
      description: The output of a MCP tool call.
      required:
      - type
      - name
      - server_label
      - arguments
      - output
      properties:
        arguments:
          type: string
          description: A JSON string of the arguments passed to the tool.
        error:
          type: string
          description: The error message of the MCP tool call.
        id:
          type: string
          description: The unique ID of the MCP tool call.
        name:
          type: string
          description: The name of the tool that was run.
        output:
          type: string
          description: The output of the MCP tool call.
        server_label:
          type: string
          description: The label of the MCP server running the tool.
        status:
          type: string
          description: The status of the MCP tool call.
        type:
          type: string
          description: The type of the MCP tool call. Always `mcp_call`.
    ModelInputContentItem:
      oneOf:
      - type: object
        description: Text input.
        required:
        - text
        - type
        properties:
          text:
            type: string
            description: Text input.
          type:
            type: string
            enum:
            - input_text
      - type: object
        description: Text output (used in compact response output items).
        required:
        - text
        - type
        properties:
          text:
            type: string
          type:
            type: string
            enum:
            - output_text
      - type: object
        description: 'Image input. Note: Storing and fetching images is not fully supported at the moment.'
        required:
        - image_url
        - type
        properties:
          file_id:
            type:
            - string
            - 'null'
            description: Only included for compatibility.
          image_url:
            type: string
            description: A public URL of image prompt, only available for vision models.
          type:
            type: string
            enum:
            - input_image
      - type: object
        description: File input.
        required:
        - type
        properties:
          file_data:
            type:
            - string
            - 'null'
            description: 'Inline file bytes (base64 encoded).


              When set, the file content is provided directly in the request and does NOT need

              to be uploaded to the Files API first.


              Exactly one of `file_id`, `file_data`, or `file_url` should be set.'
          file_id:
            type:
            - string
            - 'null'
            description: 'The file ID from the Files API.


              Set this to reference a previously-uploaded file.

              Exactly one of `file_id`, `file_data`, or `file_url` should be set.'
          file_url:
            type:
            - string
            - 'null'
            description: 'Public URL for a file attachment.


              When set, the file content is fetched from this URL.

              Exactly one of `file_id`, `file_data`, or `file_url` should be set.'
          filename:
            type:
            - string
            - 'null'
            description: 'Filename for inline uploads.


              Required when `file_data` is set.'
          mime_type:
            type:
            - string
            - 'null'
            description: Optional MIME type for inline uploads (e.g. "application/pdf").
          type:
            type: string
            enum:
            - input_file
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
