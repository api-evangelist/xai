    ModelResponse:
      type: object
      description: The response body for `/v1/responses` endpoint.
      required:
      - created_at
      - id
      - model
      - object
      - output
      - parallel_tool_calls
      - text
      - tool_choice
      - tools
      - status
      - store
      - metadata
      - background
      - service_tier
      - truncation
      - top_logprobs
      - presence_penalty
      - frequency_penalty
      properties:
        background:
          type: boolean
          description: 'OpenResponses compatibility fields.

            Not used at the moment. Just for OpenResponses compatibility.

            Whether to process the response asynchronously in the background.'
          default: false
        completed_at:
          type:
          - integer
          - 'null'
          format: int64
          description: The Unix timestamp (in seconds) for the response completion time. Only set when the response is completed.
        created_at:
          type: integer
          format: int64
          description: The Unix timestamp (in seconds) for the response creation time.
        error:
          description: An error object returned when the model fails to generate a response.
        frequency_penalty:
          type: number
          format: float
          description: (NOT SUPPORTED in Responses API) Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim.
        id:
          type: string
          description: Unique ID of the response.
        incomplete_details:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IncompleteDetails'
            description: Details about why the response is incomplete.
        instructions:
          type:
          - string
          - 'null'
          description: A system (or developer) message inserted into the model's context.
        max_output_tokens:
          type:
          - integer
          - 'null'
          format: int32
          description: Max number of tokens that can be generated in a response. This includes both output and reasoning tokens.
        max_tool_calls:
          type:
          - integer
          - 'null'
          format: int32
          description: The maximum number of tool calls allowed for this response.
        metadata:
          description: Only included for compatibility.
        model:
          type: string
          description: Model name used to generate the response.
        object:
          type: string
          description: The object type of this resource. Always set to `response`.
        output:
          type: array
          items:
            $ref: '#/components/schemas/ModelOutput'
          description: The response generated by the model.
        parallel_tool_calls:
          type: boolean
          description: Whether to allow the model to run parallel tool calls.
        presence_penalty:
          type: number
          format: float
          description: (NOT SUPPORTED in Responses API) Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics.
        previous_response_id:
          type:
          - string
          - 'null'
          description: The ID of the previous response from the model.
        prompt_cache_key:
          type:
          - string
          - 'null'
          description: The cache key used for the prompt for routing to the correct engine.
        reasoning:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ReasoningConfiguration'
            description: Reasoning configuration. Only for reasoning models.
        safety_identifier:
          type:
          - string
          - 'null'
          description: A stable identifier used to help detect users of your application that may be violating xAI's usage policies.
        service_tier:
          type: string
          description: Specifies the processing tier used for serving the request.
          default: default
        status:
          type: string
          description: Status of the response. One of `completed`, `in_progress` or `incomplete`.
        store:
          type: boolean
          description: Whether to store the input message(s) and model response for later retrieval.
          default: true
        temperature:
          type:
          - number
          - 'null'
          format: float
          description: What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
          default: 1
          maximum: 2
          minimum: 0
        text:
          $ref: '#/components/schemas/ModelResponseConfiguration'
          description: Settings for customizing a text response from the model.
        tool_choice:
          $ref: '#/components/schemas/ModelToolChoice'
          description: 'Controls which (if any) tool is called by the model. auto means the model can pick between generating a message or calling one or more tools. required means the model must call one or more tools. Specifying a particular tool via `{"type": "function", "function": {"name": "my_function"}}` forces the model to call that tool. `none` is the default when no tools are present. `auto` is the default if tools are present.'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ModelTool'
          description: A list of tools the model may call in JSON-schema. Currently, only functions and web search are supported as tools. A max of 128 tools are supported.
          maxItems: 128
        top_logprobs:
          type: integer
          format: int32
          description: An integer between 0 and 8 specifying the number of most likely tokens to return at each token position.
        top_p:
          type:
          - number
          - 'null'
          format: float
          description: An alternative to sampling with `temperature`, called nucleus sampling, where the model considers the results of the tokens with `top_p` probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. It is generally recommended to alter this or `temperature` but not both.
          default: 1
          maximum: 1
          exclusiveMinimum: 0
        truncation:
          type: string
          description: The truncation strategy to use for the model response.
          default: disabled
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ModelUsage'
            description: Token usage information.
        user:
          type:
          - string
          - 'null'
          description: A unique identifier representing your end-user, which can help xAI to monitor and detect abuse.
