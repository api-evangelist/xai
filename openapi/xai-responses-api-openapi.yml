openapi: 3.2.0
info:
  title: xAI's REST Responses API
  description: REST API for xAI compatible with other providers.
  license:
    name: ''
  version: 1.0.0
tags:
- name: Responses
paths:
  /v1/responses:
    post:
      tags:
      - Responses
      summary: Generates a response based on text or image prompts.
      operationId: handle_generic_model_request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
            example:
              input:
              - role: system
                content: You are a helpful assistant that can answer questions and help with tasks.
              - role: user
                content: What is 101*3?
              model: latest
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
              example:
                created_at: 1754475266
                id: ad5663da-63e6-86c6-e0be-ff15effa8357
                max_output_tokens: null
                model: latest
                object: response
                output:
                - content:
                  - type: output_text
                    text: 101 multiplied by 3 is 303.
                    logprobs: null
                    annotations: []
                  id: msg_ad5663da-63e6-86c6-e0be-ff15effa8357
                  role: assistant
                  type: message
                  status: completed
                parallel_tool_calls: true
                previous_response_id: null
                reasoning: null
                temperature: null
                text:
                  format:
                    type: text
                tool_choice: auto
                tools: []
                top_p: null
                usage:
                  input_tokens: 32
                  input_tokens_details:
                    cached_tokens: 8
                  output_tokens: 9
                  output_tokens_details:
                    reasoning_tokens: 110
                  total_tokens: 151
                  num_sources_used: 0
                  num_server_side_tools_used: 0
                user: null
                incomplete_details: null
                status: completed
                store: true
        '400':
          description: Bad request. The request is invalid or an invalid API key is provided.
        '422':
          description: Unprocessable Entity. There are missing fields in the request body.
      security:
      - bearerAuth: []
  /v1/responses/{response_id}:
    get:
      tags:
      - Responses
      summary: Retrieve a previously generated response
      operationId: handle_get_stored_completion_request
      parameters:
      - name: response_id
        in: path
        description: The response id returned by a previous create response request.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
              example:
                created_at: 1754475266
                id: ad5663da-63e6-86c6-e0be-ff15effa8357
                max_output_tokens: null
                model: latest
                object: response
                output:
                - content:
                  - type: output_text
                    text: 101 multiplied by 3 is 303.
                    logprobs: null
                    annotations: []
                  id: msg_ad5663da-63e6-86c6-e0be-ff15effa8357
                  role: assistant
                  type: message
                  status: completed
                - id: ''
                  summary:
                  - text: 'First, the user asked: "What is 101*3?"


                      This is a simple multiplication: 101 multiplied by 3.


                      Calculating: 100 * 3 = 300, and 1 * 3 = 3, so 300 + 3 = 303.


                      I should respond helpfully and directly, as per my system prompt: "You are a helpful assistant that can answer questions and help with tasks."


                      Keep the response concise and accurate. No need for extra fluff unless it adds value.


                      Final answer: 303.'
                    type: summary_text
                  type: reasoning
                  status: completed
                parallel_tool_calls: true
                previous_response_id: null
                reasoning: null
                temperature: null
                text:
                  format:
                    type: text
                tool_choice: auto
                tools: []
                top_p: null
                usage:
                  prompt_tokens: 32
                  completion_tokens: 9
                  total_tokens: 151
                  prompt_tokens_details:
                    text_tokens: 32
                    audio_tokens: 0
                    image_tokens: 0
                    cached_tokens: 8
                  completion_tokens_details:
                    reasoning_tokens: 110
                    audio_tokens: 0
                    accepted_prediction_tokens: 0
                    rejected_prediction_tokens: 0
                  num_sources_used: 0
                user: null
                incomplete_details: null
                status: completed
                store: true
        '400':
          description: Bad request. The request is invalid or an invalid API key is provided.
        '404':
          description: Not found. No responses could be found with the given response_id.
      security:
      - bearerAuth: []
    delete:
      tags:
      - Responses
      summary: Delete a previously generated response
      operationId: handle_delete_stored_completion_request
      parameters:
      - name: response_id
        in: path
        description: The response id returned by a previous create response request.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStoredCompletionResponse'
              example:
                id: ad5663da-63e6-86c6-e0be-ff15effa8357
                object: response
                deleted: true
        '400':
          description: Bad request. The request is invalid or an invalid API key is provided.
        '404':
          description: Not found. No responses could be found with the given response_id.
      security:
      - bearerAuth: []
components:
  schemas:
    WebSearchFilters:
      type: object
      properties:
        allowed_domains:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'List of website domains (without protocol specification or subdomains)

            to restrict search results to (e.g., ["example.com"]). A maximum of 5 websites can be allowed.

            Use this as a whitelist to limit results to only these specific sites; no other websites will

            be considered. If no relevant information is found on these websites, the number of results

            returned might be smaller than `max_search_results` set in `SearchParameters`. Note: This

            parameter cannot be set together with `excluded_domains`.'
          example:
          - example.com
          maxItems: 5
        excluded_domains:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'List of website domains (without protocol specification or subdomains) to exclude from search results (e.g., ["example.com"]).

            Use this to prevent results from unwanted sites. A maximum of 5 websites can be excluded.

            This parameter cannot be set together with `allowed_domains`.'
          example:
          - example.com
          maxItems: 5
    ModelInputContent:
      oneOf:
      - type: string
        description: Text input.
      - type: array
        items:
          $ref: '#/components/schemas/ModelInputContentItem'
        description: A list of input items to the model. Can include text and images.
    WebSearchCall:
      type: object
      description: The output of a web search tool call.
      required:
      - type
      - action
      properties:
        action:
          $ref: '#/components/schemas/WebSearchAction'
          description: 'An object describing the specific action taken in this web search call.

            Includes details on how the model used the web (search, open_page, find).'
        id:
          type: string
          description: The unique ID of the web search tool call.
        status:
          type: string
          description: The status of the web search tool call.
        type:
          type: string
          description: The type of the web search tool call. Always `web_search_call`.
    FileSearchCall:
      type: object
      description: The output of a web search tool call.
      required:
      - type
      - queries
      - results
      properties:
        id:
          type: string
          description: The unique ID of the file search tool call.
        queries:
          type: array
          items:
            type: string
          description: The queries used to search for files.
        results:
          type: array
          items:
            $ref: '#/components/schemas/FileSearchResult'
          description: The results of the file search tool call.
        status:
          type: string
          description: The status of the file search tool call.
        type:
          type: string
          description: The type of the file search tool call. Always `file_search_call`.
    ModelToolChoice:
      oneOf:
      - type: string
        description: Controls tool access by the model. `"none"` makes model ignore tools, `"auto"` let the model automatically decide whether to call a tool, `"required"` forces model to pick a tool to call.
      - type: object
        required:
        - type
        - name
        properties:
          name:
            type: string
            description: Name of the function to use.
          type:
            type: string
            description: Type is always `"function"`.
      description: Parameter to control how model chooses the tools.
    FileSearchResult:
      type: object
      required:
      - file_id
      - filename
      - text
      properties:
        file_id:
          type: string
          description: The file ID of the file search result.
        filename:
          type: string
          description: The filename of the file search result.
        score:
          type: number
          format: double
          description: 'The score of the file search result.

            Proto3 omits float fields with value 0.0; default to 0.0 when absent.'
        text:
          type: string
          description: The text of the file search result.
    ShellCallAction:
      type: object
      description: The shell commands and limits that describe how to run the tool call.
      required:
      - commands
      properties:
        commands:
          type: array
          items:
            type: string
          description: The commands to run.
        max_output_length:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional maximum number of characters to return from each command.
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Optional timeout in milliseconds for the commands.
        type:
          type:
          - string
          - 'null'
          description: The type of the action, which is always `exec`.
    InputTokensDetails:
      type: object
      required:
      - cached_tokens
      properties:
        cached_tokens:
          type: integer
          format: int32
          description: Token cached by xAI from previous requests and reused for this request.
    ModelInput:
      oneOf:
      - type: string
        description: Text input.
      - type: array
        items:
          $ref: '#/components/schemas/ModelInputPart'
        description: A list of input items to the model. Can be of different types.
      description: Content of the input passed to a `/v1/response` request.
    FunctionToolCall:
      type: object
      description: A tool call to run a function.
      required:
      - arguments
      - call_id
      - name
      - type
      properties:
        arguments:
          type: string
          description: The arguments to pass to the function, as a JSON string.
        call_id:
          type: string
          description: The unique ID of the function tool call generated by the model.
        id:
          type: string
          description: The unique ID of the function tool call.
        name:
          type: string
          description: The name of the function.
        status:
          type: string
          description: Status of the item. One of `completed`, `in_progress` or `incomplete`.
        type:
          type: string
          description: 'The type of the function tool call, which can be `"function_call"` for client-side tool calls,

            and `"web_search_call"` or `"x_search_call"` or `"code_interpreter_call"` or `"mcp_call"` for server-side tool calls.'
    ModelOutput:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/OutputMessage'
      - allOf:
        - $ref: '#/components/schemas/FunctionToolCall'
      - allOf:
        - $ref: '#/components/schemas/Reasoning'
      - allOf:
        - $ref: '#/components/schemas/WebSearchCall'
      - allOf:
        - $ref: '#/components/schemas/FileSearchCall'
      - allOf:
        - $ref: '#/components/schemas/CodeInterpreterCall'
      - allOf:
        - $ref: '#/components/schemas/McpCall'
      - allOf:
        - $ref: '#/components/schemas/CustomToolCall'
      - allOf:
        - $ref: '#/components/schemas/ShellCall'
    ModelInputPart:
      oneOf:
      - type: object
        description: Message input to the model.
        required:
        - content
        - role
        properties:
          content:
            $ref: '#/components/schemas/ModelInputContent'
            description: Text, image or audio input.
          name:
            type:
            - string
            - 'null'
            description: A unique identifier representing your end-user, which can help xAI to monitor and detect abuse. Only supported for `user` messages.
          role:
            type: string
            description: The role of the message. Possible values are `user`, `assistant`, `system` and `developer`.
          type:
            type:
            - string
            - 'null'
            description: The type of the message, which is always `message`.
      - allOf:
        - $ref: '#/components/schemas/ModelOutput'
        description: The model output from previous responses.
      - allOf:
        - $ref: '#/components/schemas/FunctionToolCallOutput'
        description: The output of a function call.
      - allOf:
        - $ref: '#/components/schemas/ShellCallOutput'
        description: The output of a shell call.
      - allOf:
        - $ref: '#/components/schemas/CompactionOutputItem'
        description: A compaction item from a previous `/v1/responses/compact` call.
    ReasoningText:
      type: object
      required:
      - text
      - type
      properties:
        text:
          type: string
          description: Reasoning done by the model.
        type:
          type: string
          description: The type of the object, which is always `reasoning_text`.
    WebSearchSource:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: The type of source.
        url:
          type: string
          description: The URL of the source.
    FunctionToolCallOutput:
      type: object
      description: The output of a function tool call.
      required:
      - call_id
      - output
      - type
      properties:
        call_id:
          type: string
          description: The unique ID of the function tool call generated by the model.
        output:
          type: string
          description: The output of the function tool call, as a JSON string.
        type:
          type: string
          description: The type of the function tool call, which is always `function_call_output`.
    FunctionDefinition:
      type: object
      description: Definition of the tool call made available to the model.
      required:
      - name
      - parameters
      properties:
        description:
          type:
          - string
          - 'null'
          description: A description of the function to indicate to the model when to call it.
        name:
          type: string
          description: 'The name of the function. If the model calls the function, this name is used in the

            response.'
        parameters:
          description: 'A JSON schema describing the function parameters. The model _should_ follow the schema,

            however, this is not enforced at the moment.'
        strict:
          type:
          - boolean
          - 'null'
          description: Not supported. Only maintained for compatibility reasons.
    OutputTokensDetails:
      type: object
      required:
      - reasoning_tokens
      properties:
        reasoning_tokens:
          type: integer
          format: int32
          description: Tokens generated by the model for reasoning.
    ReasoningConfiguration:
      type: object
      properties:
        effort:
          type:
          - string
          - 'null'
          description: Constrains how hard a reasoning model thinks before responding. Possible values are `low` (uses fewer reasoning tokens), `medium` and `high` (uses more reasoning tokens).
          default: medium
        generate_summary:
          type:
          - string
          - 'null'
          description: Only included for compatibility.
        summary:
          type:
          - string
          - 'null'
          description: A summary of the model's reasoning process. Possible values are `auto`, `concise` and `detailed`. Only included for compatibility. The model shall always return `detailed`.
    ModelResponseFormat:
      oneOf:
      - type: object
        description: Specify text response format, always `"text"`.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - text
      - type: object
        description: Specify json_object response format, always `json_object`. Used for backward compatibility. Prefer to use `"json_schema"` instead of this.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - json_object
      - type: object
        description: Specify json_schema response format with a given schema. Type is always `"json_schema"`.
        required:
        - schema
        - type
        properties:
          description:
            type:
            - string
            - 'null'
            description: Only included for compatibility.
          name:
            type:
            - string
            - 'null'
            description: Only included for compatibility.
          schema:
            description: A json schema representing the desired response schema.
          strict:
            type:
            - boolean
            - 'null'
            description: Only included for compatibility.
          type:
            type: string
            enum:
            - json_schema
      description: Response format parameter for structured outputs.
    CodeInterpreterCall:
      type: object
      description: The output of a code interpreter tool call.
      required:
      - type
      - outputs
      properties:
        code:
          type: string
          description: The code of the code interpreter tool call.
        id:
          type: string
          description: The unique ID of the code interpreter tool call.
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/CodeInterpreterOutput'
          description: The outputs of the code interpreter tool call.
        status:
          type: string
          description: The status of the code interpreter tool call.
        type:
          type: string
          description: The type of the code interpreter tool call. Always `code_interpreter_call`.
    OutputMessageContent:
      oneOf:
      - type: object
        description: Text output.
        required:
        - text
        - type
        properties:
          annotations:
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
            description: Citations.
          logprobs:
            type: array
            items:
              $ref: '#/components/schemas/TokenLogProb'
            description: The log probabilities of each output token returned in the content of message.
          text:
            type: string
            description: The text output from the model.
          type:
            type: string
            enum:
            - output_text
      - type: object
        description: Refusal.
        required:
        - refusal
        - type
        properties:
          refusal:
            type: string
            description: The reason for the refusal.
          type:
            type: string
            enum:
            - refusal
    ServerSideToolUsageDetails:
      type: object
      required:
      - web_search_calls
      - x_search_calls
      - code_interpreter_calls
      - file_search_calls
      - mcp_calls
      - document_search_calls
      properties:
        code_interpreter_calls:
          type: integer
          format: int32
          description: Number of code interpreter calls.
        document_search_calls:
          type: integer
          format: int32
          description: Number of document search calls.
        file_search_calls:
          type: integer
          format: int32
          description: Number of file search calls.
        mcp_calls:
          type: integer
          format: int32
          description: Number of MCP calls.
        web_search_calls:
          type: integer
          format: int32
          description: Number of web search calls.
        x_search_calls:
          type: integer
          format: int32
          description: Number of X search calls.
    Annotation:
      type: object
      required:
      - type
      - url
      properties:
        end_index:
          type:
          - integer
          - 'null'
          format: int32
          description: The end index of the annotation.
        start_index:
          type:
          - integer
          - 'null'
          format: int32
          description: The summary of the annotation.
        title:
          type:
          - string
          - 'null'
          description: The title of the annotation.
        type:
          type: string
          description: The type of the annotation. Only supported type currently is `url_citation`.
        url:
          type: string
          description: The URL of the web resource.
    ShellCallOutputResult:
      type: object
      description: The content of a shell tool call output that was emitted.
      required:
      - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/ShellCallOutcome'
          description: The outcome of the command execution.
        stderr:
          type: string
          description: The standard error output that was captured.
        stdout:
          type: string
          description: The standard output that was captured.
    ModelResponseConfiguration:
      type: object
      properties:
        format:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ModelResponseFormat'
            description: 'An object specifying the format that the model must output. Specify `{ "type": "json_object" }` for JSON output, or `{ "type": "json_schema", "json_schema": {...} }` for structured outputs. If `{ \"type\": \"text\" }`, the model will return a text response.'
    IncompleteDetails:
      oneOf:
      - type: object
        required:
        - reason
        properties:
          reason:
            type: string
            enum:
            - max_output_tokens
      - type: object
        required:
        - reason
        properties:
          reason:
            type: string
            enum:
            - max_prompt_tokens
      - type: object
        required:
        - reason
        properties:
          reason:
            type: string
            enum:
            - max_time_limit
      description: Details about why a response is incomplete.
    WebSearchAction:
      oneOf:
      - type: object
        description: Action type "search" - Performs a web search query.
        required:
        - query
        - type
        properties:
          query:
            type: string
            description: The search query.
          sources:
            type: array
            items:
              $ref: '#/components/schemas/WebSearchSource'
            description: The sources used in the search.
          type:
            type: string
            enum:
            - search
      - type: object
        description: Action type "open_page" - Opens a specific URL from search results.
        required:
        - url
        - type
        properties:
          type:
            type: string
            enum:
            - open_page
          url:
            type: string
            description: The URL of the page to open.
      - type: object
        description: 'Action type "find": Searches for a pattern within a loaded page.'
        required:
        - source
        - pattern
        - type
        properties:
          pattern:
            type: string
            description: The pattern or text to search for within the page.
          source:
            $ref: '#/components/schemas/WebSearchSource'
            description: The source of the page to search in.
          type:
            type: string
            enum:
            - find
    CodeInterpreterOutput:
      oneOf:
      - type: object
        description: The output of the code interpreter tool call.
        required:
        - logs
        - type
        properties:
          logs:
            type: string
            description: The output of the code interpreter tool call.
          type:
            type: string
            enum:
            - logs
      - type: object
        description: The error of the code interpreter tool call.
        required:
        - url
        - type
        properties:
          type:
            type: string
            enum:
            - image
          url:
            type: string
            description: The error of the code interpreter tool call.
    ShellCallOutput:
      type: object
      description: The output of a shell tool call, sent by the client after local execution.
      required:
      - call_id
      - output
      - type
      properties:
        call_id:
          type: string
          description: The unique ID of the shell tool call generated by the model.
        max_output_length:
          type:
          - integer
          - 'null'
          format: int32
          description: 'The maximum length of the shell command output. Generated by the model

            and should be passed back with the raw output.'
        output:
          type: array
          items:
            $ref: '#/components/schemas/ShellCallOutputResult'
          description: An array of shell call output contents.
        type:
          type: string
          description: The type of the output item, which is always `shell_call_output`.
    ShellCallOutcome:
      oneOf:
      - type: object
        description: The command exited normally.
        required:
        - exit_code
        - type
        properties:
          exit_code:
            type: integer
            format: int32
            description: The exit code of the command.
          type:
            type: string
            enum:
            - exit
      - type: object
        description: The command timed out.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - timeout
      description: The outcome of a shell command execution.
    DeleteStoredCompletionResponse:
      type: object
      description: Response to delete a stored completion.
      required:
      - id
      - object
      - deleted
      properties:
        deleted:
          type: boolean
          description: Whether the response was successfully deleted.
        id:
          type: string
          description: The response_id to be deleted.
        object:
          type: string
          description: The deleted object type, which is always `response`.
    CustomToolCall:
      type: object
      description: The output of a custom tool call.
      required:
      - call_id
      - name
      - type
      - id
      properties:
        call_id:
          type: string
          description: The unique ID of the function tool call generated by the model.
        id:
          type: string
          description: The status of the custom tool call.
        input:
          type: string
          description: The unique ID of the custom tool call,
        name:
          type: string
          description: An identifier used to map this custom tool call to a tool call output.
        status:
          type: string
          description: Status of the item. One of `completed`, `in_progress` or `incomplete`.
        type:
          type: string
          description: The input for the custom tool call generated by the model.
    SearchParameters:
      type: object
      description: Parameters to control realtime data.
      properties:
        from_date:
          type:
          - string
          - 'null'
          format: date
          description: 'Date from which to consider the results in ISO-8601 YYYY-MM-DD. See

            <https://en.wikipedia.org/wiki/ISO_8601>.'
          example: '2024-06-24'
        max_search_results:
          type:
          - integer
          - 'null'
          format: int32
          description: Maximum number of search results to use.
          default: 15
          maximum: 30
          minimum: 1
        mode:
